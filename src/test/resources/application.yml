spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  datasource:
    url: jdbc:h2:mem:bulk-update-debug;DB_CLOSE_DELAY=-1;MODE=PostgreSQL

logging:
  level:
    com.example.bulkupdate: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
